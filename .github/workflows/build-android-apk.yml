name: Build Android APK

# Manual trigger by default (Actions tab -> Build Android APK -> Run workflow),
# plus auto-run when mobile app code changes on main so a fresh APK is always
# available after real changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --non-interactive

      - name: Bundle JavaScript into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          echo "Bundle size:"
          ls -lh android/app/src/main/assets/index.android.bundle

      - name: Build release APK (arm64 only, for a much smaller download)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify the JS bundle is inside the built APK
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep index.android.bundle \
            || (echo "::error::index.android.bundle is missing from the APK - the app will crash on launch." && exit 1)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-monitor-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
